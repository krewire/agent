name: Nightly Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Agent Nightly Conformance & Benchmark Pipeline
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly Tests & Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Provision Core Dependencies
        run: |
          mkdir -p ..
          if [ ! -d "../krewire" ]; then
            git clone --depth 1 https://github.com/krewire/krewire.git ../krewire
          fi

      - name: Run Tests with Race Detector
        run: |
          go test -v -race ./core/... ./conformance/...

      - name: Run Benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./core/...
